name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Project Structure
        run: |
          mkdir -p www
          cp index.html www/index.html
          echo '{"name": "clean-html-app", "version": "1.0.0", "dependencies": {}}' > package.json
          echo '{"appId": "com.cleanhtmlapp.app", "appName": "My App", "webDir": "www"}' > capacitor.config.json

      - name: Install Tools Non-Interactively
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android --confirm
          npx cap sync

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Pure APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Clean Ad-Free APK
        uses: actions/upload-artifact@v4
        with:
          name: Clean-AdFree-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
