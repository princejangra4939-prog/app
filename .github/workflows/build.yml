name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup NodeJS Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Native Application Settings
        run: |
          rm -rf www android package.json package-lock.json capacitor.config.json
          mkdir -p www
          cp index.html www/index.html
          echo '{"name": "htmlapp", "version": "1.0.0", "dependencies": {}}' > package.json
          echo '{"appId": "com.cleanhtmlapp.app", "appName": "My Clean App", "webDir": "www"}' > capacitor.config.json

      - name: Install Mobile Build Packages
        run: |
          npm install @capacitor/core@5 @capacitor/cli@5
          npm install @capacitor/android@5

      - name: Inject Android Studio Core Platform
        run: npx cap add android

      - name: Synchronize Asset Directories
        run: npx cap sync

      - name: Compile Pure Signed Android APK File
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Clean Ad-Free APK
        uses: actions/upload-artifact@v4
        with:
          name: Clean-AdFree-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
